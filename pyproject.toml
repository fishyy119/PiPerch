[build-system]
requires = ["hatchling>=1.27,<2"]
build-backend = "hatchling.build"

[project]
name = "piperch"
version = "0.1.0"
description = "本地优先的 Pixiv 下载、浏览与管理工具"
readme = "README.md"
requires-python = ">=3.12,<3.13"
license = "MIT"
authors = [{ name = "fishyy119" }]
dependencies = [
    "alembic>=1.14,<2",
    "fastapi>=0.115,<1",
    "httpx>=0.28,<1",
    "pillow>=11,<13",
    "pydantic>=2.10,<3",
    "sqlalchemy>=2.0.36,<3",
    "uvicorn>=0.32,<1",
]

[project.scripts]
piperch = "piperch.cli:main"

[dependency-groups]
test = [
    "pytest>=8.3,<10",
    "pytest-asyncio>=0.24,<2",
    "pytest-cov>=6,<8",
    "respx>=0.22,<1",
]
lint = ["pyright>=1.1.390,<2", "ruff>=0.9,<1"]
dev = [{ include-group = "test" }, { include-group = "lint" }]

[tool.hatch.build.targets.wheel]
packages = ["src/piperch"]
artifacts = ["/src/piperch/frontend/**"]

[tool.ruff]
target-version = "py312"
line-length = 120
src = ["src", "tests"]

[tool.ruff.lint]
select = [
    "ANN",
    "ASYNC",
    "B",
    "C4",
    "DTZ",
    "E",
    "F",
    "I",
    "PERF",
    "PTH",
    "RUF",
    "S",
    "SIM",
    "TC",
    "UP",
]
ignore = ["ANN401"]
allowed-confusables = ["，"]

[tool.ruff.lint.per-file-ignores]
"src/piperch/database/migrations/**" = ["ANN", "E501"]
"src/piperch/api/**" = ["B008", "TC001", "TC003"]
"src/piperch/app.py" = ["TC003"]
"tests/**" = ["S101"]

[tool.ruff.format]
quote-style = "double"
indent-style = "space"
line-ending = "lf"
docstring-code-format = true

[tool.pyright]
include = ["src", "tests"]
exclude = ["frontend", "src/piperch/database/migrations"]
pythonVersion = "3.12"
typeCheckingMode = "strict"
reportMissingTypeStubs = "none"

[tool.pytest.ini_options]
addopts = [
    "--import-mode=importlib",
    "--strict-config",
    "--strict-markers",
    "-ra",
]
testpaths = ["tests"]
asyncio_mode = "strict"
filterwarnings = [
    "error",
    "ignore:Using `httpx` with `starlette.testclient` is deprecated:starlette.exceptions.StarletteDeprecationWarning",
]
